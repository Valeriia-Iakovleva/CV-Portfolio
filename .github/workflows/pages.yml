name: Build and deploy GitHub Pages

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm run test:site
      - run: npm run test:html
      - name: Upload tested branch output
        if: github.event_name == 'pull_request' || github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: cv-review-${{ github.run_id }}
          path: |
            dist/
            docs/QA.md
            docs/screenshots/
          retention-days: 14
          if-no-files-found: error
      - name: Write review summary
        if: github.event_name == 'pull_request' || github.ref != 'refs/heads/main'
        run: |
          cat <<'MARKDOWN' >> "$GITHUB_STEP_SUMMARY"
          ## CV branch review
          - Astro/TypeScript, production build, site regression checks, and HTML/accessibility markup validation passed.
          - The review artifact contains the tested static site and documented visual evidence.
          - This run does not merge the PR or deploy the branch to production.
          - Automated checks are not a complete WCAG audit; manual testing limits are recorded in docs/QA.md.
          MARKDOWN
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

